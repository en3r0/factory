name: head
version: 0.1.0
description: "Factory head: plans epics and task specs, dispatches cards, reports to the operator."
author: "factory"
# Installed per project with a prefixed name, e.g.
#   hermes profile install ~/Projects/factory/roles/head --name cliphuman-head
# (the head is factory-wide and keeps the name "head"). Refresh with `hermes profile update`,
# which keeps memories, sessions, .env and the installed config.yaml.
env_requires:
  - name: OPENROUTER_API_KEY
    description: "This profile's own OpenRouter key, with a $7/month credit limit"
    required: true
