name: CI
# Runs on every pull request, including docs-only ones: the factory needs at least one check on every
# PR (see ~/Projects/factory/AGENTS.md). Add the product's tests and lint as further steps.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (changes in this PR)
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gl.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" gl.txt | sed 's/ .*/  gl.tgz/' | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --no-banner --redact --log-opts="origin/${{ github.base_ref }}..HEAD"
